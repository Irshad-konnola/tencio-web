name: Tencio CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run astro check

      - name: Build Test
        run: npm run build
        env:
          # Note: We provide dummy keys here just so the build doesn't fail
          # Real keys will live securely in Vercel's dashboard
          LEAD_WEBHOOK_URL: "dummy_key_for_ci"
          GROQ_API_KEY: "dummy_key_for_ci"